plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.kompicka.kucharka'
    compileSdk 34

    defaultConfig {
        applicationId "cz.kompicka.kucharka"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASS")
                keyAlias "kucharka"
                keyPassword System.getenv("KEYSTORE_PASS")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
