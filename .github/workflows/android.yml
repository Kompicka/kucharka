name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Decode signing keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Build release APK
        run: gradle -p android assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.p12
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: Publish APK to release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kucharka.apk
          gh release create android-latest --title "Aplikace pro Android" \
            --notes "Kuchařka pro Zůníky jako aplikace pro Android. Stáhni kucharka.apk a nainstaluj." \
            2>/dev/null || true
          gh release upload android-latest kucharka.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
